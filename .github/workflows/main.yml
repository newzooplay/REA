name: ZooPLAY App Analysis (REA)

on:
  workflow_dispatch:
    inputs:
      target_type:
        description: "What are you analyzing?"
        required: true
        type: choice
        options:
          - apk
          - javascript-repository
      target_url:
        description: "Direct APK download URL or Git repository URL (public URL)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rea-analysis-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Java for APK analysis
        if: inputs.target_type == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install REA
        run: npm install --global rea-agents@latest

      - name: Download and verify JADX bridge for APK analysis
        if: inputs.target_type == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea"
          curl --fail --location --silent --show-error \
            --max-time 120 \
            --output "$RUNNER_TEMP/rea/jadx-headless-mcp-0.7.1-all.jar" \
            "https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar"
          echo "6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  $RUNNER_TEMP/rea/jadx-headless-mcp-0.7.1-all.jar" | sha256sum --check
          echo "REA_JADX_MCP_JAR=$RUNNER_TEMP/rea/jadx-headless-mcp-0.7.1-all.jar" >> "$GITHUB_ENV"

      - name: Download APK target
        if: inputs.target_type == 'apk'
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/input reports
          # Only download an APK from a URL you trust and are authorized to analyze.
          curl --fail --location --silent --show-error \
            --max-time 180 --max-filesize 800000000 \
            "$TARGET_URL" -o artifacts/input/target.apk
          file artifacts/input/target.apk
          sha256sum artifacts/input/target.apk | tee reports/apk-sha256.txt
          # Basic ZIP signature check; JADX will validate deeper structure.
          python - <<'PY'
          from pathlib import Path
          p = Path("artifacts/input/target.apk")
          with p.open("rb") as f:
              sig = f.read(4)
          if sig[:2] != b"PK":
              raise SystemExit("Downloaded file does not look like an APK/ZIP archive.")
          PY

      - name: Analyze APK with REA
        if: inputs.target_type == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          rea inspect-android-package "$GITHUB_WORKSPACE/artifacts/input/target.apk" --json \
            > reports/apk-analysis.json

      - name: Clone JavaScript/Electron repository
        if: inputs.target_type == 'javascript-repository'
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          set -euo pipefail
          mkdir -p artifacts reports
          # Do not execute the target repository's install scripts or app code.
          git clone --depth 1 --no-recurse-submodules "$TARGET_URL" artifacts/target-source
          git -C artifacts/target-source rev-parse HEAD | tee reports/source-commit.txt
          find artifacts/target-source -maxdepth 3 -type f \
            \( -name 'package.json' -o -name 'electron-builder.yml' -o -name 'vite.config.*' \
               -o -name 'webpack.config.*' -o -name 'README*' \) \
            -print > reports/project-files.txt

      - name: Analyze JavaScript/Electron repository with REA
        if: inputs.target_type == 'javascript-repository'
        shell: bash
        run: |
          set -euo pipefail
          rea analyze-javascript-application "$GITHUB_WORKSPACE/artifacts/target-source" --json \
            > reports/javascript-analysis.json

      - name: Write analysis notes
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          cat > reports/README.md <<'EOF'
          # REA static analysis output

          This artifact contains static analysis evidence produced by REA. It is not a guarantee
          that every feature, backend behavior, or runtime path has been recovered.

          - APK: package/manifest and decompiler evidence. APK authenticity/signature verification
            and runtime behavior are not established by this workflow.
          - JavaScript/Electron: module/import evidence from the supplied source directory.
          - Unknowns: backend-only behavior, secrets not present in the artifact, dynamic/reflection
            behavior, and runtime-only states may require separate authorized investigation.

          Review the JSON as untrusted data. Do not publish tokens, private URLs, personal data,
          or proprietary source without permission.
          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-analysis-${{ github.run_number }}
          path: |
            reports/
            artifacts/input/target.apk
          if-no-files-found: warn
          retention-days: 7
